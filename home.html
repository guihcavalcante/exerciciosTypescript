<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Questões</title>
    
    <link rel="stylesheet" href="./src/styles/global.css">
    <link rel="stylesheet" href="./src/styles/home.css">

    <!-- Biblioteca que permite rodar TypeScript direto no navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typescript/5.2.2/typescript.min.js"></script>

    <script type="module" src="./dist/index.js" defer></script>
</head>
<body>

    <section id="tela-bemvindo" class="tela ativa">
        <div class="card-boas-vindas">
            <h1>Bem-vindo à Lista de Questões</h1>
            <p>Professor: [Seu Nome Aqui]</p>
            <button onclick="navegar('tela-topicos')" class="btn-destaque">Entrar</button>
        </div>
    </section>

    <section id="tela-topicos" class="tela oculto">
        <h2>Escolha um Tópico</h2>
        <div class="grid-topicos">
            <button onclick="abrirTopico('condicional')">Condicional</button>
            <button onclick="abrirTopico('repeticao')">Repetição</button>
            <button onclick="abrirTopico('funcoes')">Funções</button>
            <button onclick="abrirTopico('array')">Array</button>
            <button onclick="abrirTopico('poo')">POO</button>
            <button onclick="abrirTopico('exerciciosLista')">Exercícios da Lista</button>
        </div>
        <button onclick="navegar('tela-bemvindo')" class="btn-voltar">Voltar</button>
    </section>

    <section id="tela-questoes" class="tela oculto">
        <h2 id="titulo-topico-atual">Questões</h2>
        <div id="lista-botoes-questoes" class="container-botoes">
        </div>
        <button onclick="navegar('tela-topicos')" class="btn-voltar">Voltar aos Tópicos</button>
    </section>

    <section id="tela-codigo" class="tela oculto">
        <div class="cabecalho-codigo">
            <h2 id="titulo-questao-atual">Questão 1</h2>
            <button id="btn-rodar" class="btn-destaque" onclick="rodarCodigo()">▶ Rodar Código</button>
        </div>
        
        <div class="area-codigo">
            <textarea id="editor-codigo" spellcheck="false" style="height: 400px;"></textarea>
        </div>

        <button onclick="navegar('tela-questoes')" class="btn-voltar">Voltar às Questões</button>
    </section>

</body>
</html>
